<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Menlo, Consolas, monospace">
<title>FitPulse corrected architecture diagram</title>
<desc>React frontend calls API Gateway, which routes to three services: User Service backed by PostgreSQL, Activity Service backed by MongoDB, and AI Service backed by MongoDB. Activity Service publishes to RabbitMQ, which is consumed by AI Service, which in turn calls the Gemini API.</desc>

<rect x="0" y="0" width="680" height="380" fill="#0d1117"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#e3b341" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- React Frontend -->
<rect x="260" y="20" width="160" height="44" rx="6" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
<text x="340" y="46" text-anchor="middle" fill="#e6edf3" font-size="14">React Frontend</text>
<line x1="340" y1="64" x2="340" y2="92" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- API Gateway -->
<rect x="240" y="94" width="200" height="56" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="340" y="116" text-anchor="middle" fill="#e6edf3" font-size="14">API Gateway : 8080</text>
<text x="340" y="134" text-anchor="middle" fill="#8b949e" font-size="11">Routing, JWT validation</text>

<!-- branch lines -->
<line x1="340" y1="150" x2="340" y2="174" stroke="#8b949e" stroke-width="1.2"/>
<line x1="140" y1="174" x2="540" y2="174" stroke="#8b949e" stroke-width="1.2"/>
<line x1="140" y1="174" x2="140" y2="194" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="174" x2="340" y2="194" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="540" y1="174" x2="540" y2="194" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Services -->
<rect x="50" y="196" width="180" height="56" rx="6" fill="none" stroke="#5dcaa5" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="140" y="218" text-anchor="middle" fill="#e6edf3" font-size="14">User Service : 8081</text>
<text x="140" y="236" text-anchor="middle" fill="#8b949e" font-size="11">Auth, BCrypt, JWT issue</text>

<rect x="250" y="196" width="180" height="56" rx="6" fill="none" stroke="#5dcaa5" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="340" y="218" text-anchor="middle" fill="#e6edf3" font-size="14">Activity Service : 8082</text>
<text x="340" y="236" text-anchor="middle" fill="#8b949e" font-size="11">Tracks activity events</text>

<rect x="450" y="196" width="180" height="56" rx="6" fill="none" stroke="#5dcaa5" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="540" y="218" text-anchor="middle" fill="#e6edf3" font-size="14">AI Service : 8083</text>
<text x="540" y="236" text-anchor="middle" fill="#8b949e" font-size="11">Recommendation engine</text>

<!-- tier3 -> tier4 arrows -->
<line x1="140" y1="252" x2="110" y2="282" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="252" x2="225" y2="282" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="252" x2="340" y2="282" stroke="#e3b341" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
<line x1="540" y1="252" x2="455" y2="282" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="540" y1="252" x2="570" y2="282" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>

<text x="355" y="271" fill="#e3b341" font-size="11">publishes</text>

<!-- RabbitMQ -> AI Service (async consume) -->
<path d="M390,284 L390,266 L540,266 L540,254" fill="none" stroke="#e3b341" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
<text x="470" y="262" fill="#e3b341" font-size="11">consumes</text>

<!-- Tier 4 datastores -->
<rect x="60" y="284" width="100" height="40" rx="4" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="2,2"/>
<text x="110" y="308" text-anchor="middle" fill="#e6edf3" font-size="13">PostgreSQL</text>

<rect x="175" y="284" width="100" height="40" rx="4" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="2,2"/>
<text x="225" y="308" text-anchor="middle" fill="#e6edf3" font-size="13">MongoDB</text>

<rect x="290" y="284" width="100" height="40" rx="4" fill="none" stroke="#e3b341" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="340" y="308" text-anchor="middle" fill="#e6edf3" font-size="13">RabbitMQ</text>

<rect x="405" y="284" width="100" height="40" rx="4" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="2,2"/>
<text x="455" y="308" text-anchor="middle" fill="#e6edf3" font-size="13">MongoDB</text>

<rect x="520" y="284" width="100" height="40" rx="4" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="570" y="308" text-anchor="middle" fill="#e6edf3" font-size="13">Gemini API</text>

</svg>
