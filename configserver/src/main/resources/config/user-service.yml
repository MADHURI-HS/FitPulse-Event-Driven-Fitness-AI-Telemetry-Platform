server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_user_db
    username: postgres
    password: admin@123
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Shared HMAC secret used to sign JWTs on register/login.
# Must match api-gateway.yml's jwt.secret exactly - the gateway validates
# tokens signed here.
jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-replace-me-before-deploying-32chars+}
  expiration-ms: 86400000 # 24 hours
